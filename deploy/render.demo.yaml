# Template local. Importar SOMENTE após autorização de contas/permissões.
# Nomes de recursos propostos, não URLs existentes. Escolher região próxima ao Neon.
services:
  - type: web
    name: ramon-itops-api
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build -w @ramon-itops/database && npm run build -w @ramon-itops/api
    startCommand: npm run start -w @ramon-itops/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_CLEANUP_ENABLED
        value: "true"
      - key: DEMO_DATABASE_ID
        sync: false
      - key: DEMO_IP_HASH_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        sync: false
  - type: web
    name: ramon-itops
    runtime: static
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build -w @ramon-itops/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
# CSP do frontend deve ser preenchida no painel com a origem REAL da API antes da abertura pública.
# Não existe migration em build/start nem cron pago neste template.
